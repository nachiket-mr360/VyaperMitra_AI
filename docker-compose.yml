services:
  app:
    build: .
    image: vyaparmitra:local
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /var/data/vyaparmitra.db
      FRONTEND_DIST: /app/frontend/dist
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      HOST: 0.0.0.0
      PORT: "5000"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env to a random value of at least 32 characters}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GNANI_API_KEY: ${GNANI_API_KEY:-}
      GNANI_ENABLED: ${GNANI_ENABLED:-true}
      GNANI_STT_URL: ${GNANI_STT_URL:-https://api.vachana.ai/stt/v3}
      GNANI_STT_MODEL: ${GNANI_STT_MODEL:-prisma-v3.0}
      GNANI_TTS_VOICE: ${GNANI_TTS_VOICE:-Lakshmi}
      GNANI_TTS_MODEL: ${GNANI_TTS_MODEL:-timbre-v3.0}
      TTS_PLAYBACK_RATE: ${TTS_PLAYBACK_RATE:-1.12}
    volumes:
      - vyaparmitra-data:/var/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5).read()",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  vyaparmitra-data:
